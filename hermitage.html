<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>FC Hermitage</title>

  <!-- Page d'entrée du site FC Hermitage. Ajoutée à l'écran d'accueil, elle
       donne une application à part entière : son icône, son nom, et
       l'ouverture directe sur le site — sans passer par le hub. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FCH">
  <link rel="apple-touch-icon" href="img/icone-fch-180.png">
  <link rel="icon" href="img/icone-fch-180.png" type="image/png">
  <link rel="manifest" href="manifest-fch.json">
  <meta name="theme-color" content="#113693">


  <!-- Les deux polices du PREMIER écran, demandées avant que la feuille de
       style ne les réclame : sans ça, le navigateur ne les découvre qu'après
       avoir lu le CSS, et le texte s'affiche un instant dans la police du
       système avant de sauter. `crossorigin` est obligatoire même pour nos
       propres fichiers — une police est toujours demandée en mode anonyme, et
       sans lui le préchargement est jeté puis refait. -->
  <!-- Le corps de texte du site FCH -->
  <link rel="preload" href="fonts/Gilroy-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Les titres -->
  <link rel="preload" href="fonts/Gilroy-Bold.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/yuno.css">
  <link rel="stylesheet" href="css/fch.css">
</head>
<body data-entree="hermitage">

  <div id="ecran-chargement" class="ecran-plein">
    <p class="discret">Un instant…</p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
