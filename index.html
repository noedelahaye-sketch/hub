<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Hub — Noé</title>

  <!-- Ajouté à l'écran d'accueil du téléphone, le hub s'ouvre en plein écran :
       c'est là qu'a lieu le check-in du matin. Les sites Yuno et FC Hermitage
       ont leurs propres pages d'entrée (yuno.html, hermitage.html), donc leurs
       propres icônes et leurs propres applications. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hub">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="icon" href="img/apple-touch-icon.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17191a" media="(prefers-color-scheme: dark)">


  <!-- Les deux polices du PREMIER écran, demandées avant que la feuille de
       style ne les réclame : sans ça, le navigateur ne les découvre qu'après
       avoir lu le CSS, et le texte s'affiche un instant dans la police du
       système avant de sauter. `crossorigin` est obligatoire même pour nos
       propres fichiers — une police est toujours demandée en mode anonyme, et
       sans lui le préchargement est jeté puis refait. -->
  <!-- Le corps de texte du hub -->
  <link rel="preload" href="fonts/InstrumentSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Le « Bonjour Noé » et les titres -->
  <link rel="preload" href="fonts/ClashDisplay-700.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/yuno.css">
  <link rel="stylesheet" href="css/fch.css">
</head>
<body data-entree="hub">

  <!-- Affiché tant qu'on ne sait pas s'il y a une session. Évite le flash de
       l'écran de connexion quand la session est déjà en localStorage. Le reste
       de la coquille est bâti par js/app.js, commun aux trois entrées. -->
  <div id="ecran-chargement" class="ecran-plein">
    <p class="discret">Un instant…</p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
