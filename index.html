<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Hub — Noé</title>

  <!-- Ajouté à l'écran d'accueil du téléphone, le hub s'ouvre en plein écran :
       c'est là qu'a lieu le check-in du matin. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hub">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="icon" href="img/apple-touch-icon.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17191a" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Affiché tant qu'on ne sait pas s'il y a une session. Évite le flash de
       l'écran de connexion quand la session est déjà en localStorage. -->
  <div id="ecran-chargement" class="ecran-plein">
    <p class="discret">Un instant…</p>
  </div>

  <!-- Écran de connexion : visible uniquement sans session. -->
  <div id="ecran-connexion" class="ecran-plein" hidden>
    <form id="form-connexion" class="carte carte-connexion">
      <h1>Hub</h1>
      <p class="discret">Connecte-toi pour retrouver tes projets.</p>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="username" required>

      <label for="motdepasse">Mot de passe</label>
      <input type="password" id="motdepasse" name="motdepasse" autocomplete="current-password" required>

      <button type="submit" id="bouton-connexion">Se connecter</button>
      <p id="erreur-connexion" class="message-erreur" role="alert" hidden></p>
    </form>
  </div>

  <!-- Application : visible uniquement avec une session. -->
  <div id="app" hidden>

    <header class="entete">
      <span class="entete-titre">Hub</span>
      <button type="button" id="bouton-deconnexion" class="lien-discret">Se déconnecter</button>
    </header>

    <!-- Avant <main> : sur téléphone la barre est fixée en bas par la CSS,
         sur grand écran elle se pose naturellement sous l'en-tête. -->
    <nav class="navigation" aria-label="Espaces">
      <a href="#dashboard" data-nav="dashboard">Accueil</a>
      <a href="#formation" data-nav="formation">Formation</a>
      <a href="#photo" data-nav="photo">Photo</a>
      <a href="#fch" data-nav="fch">FCH</a>
      <a href="#perso" data-nav="perso">Perso</a>
    </nav>

    <!-- Les id sont préfixés : sans ça, `#photo` dans la barre d'adresse ferait
         défiler le navigateur jusqu'à l'élément `id="photo"`, ce qui écraserait
         la position restaurée par le routeur. -->
    <main id="vue">
      <section class="espace" id="espace-dashboard" data-espace="dashboard" hidden></section>
      <section class="espace" id="espace-formation" data-espace="formation" hidden></section>
      <section class="espace" id="espace-photo" data-espace="photo" hidden></section>
      <section class="espace" id="espace-fch" data-espace="fch" hidden></section>
      <section class="espace" id="espace-perso" data-espace="perso" hidden></section>
    </main>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
